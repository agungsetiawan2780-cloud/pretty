<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeri Spesial Buat Kamu ❤️</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffeef2;
            color: #333;
            text-align: center;
            padding: 20px;
            margin: 0;
        }

        h1 {
            color: #ff4d6d;
            margin-top: 40px;
        }

        p {
            font-size: 1.2rem;
            font-style: italic;
            color: #555;
        }

        .gallery {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
            padding: 20px;
        }

        .gallery img {
            width: 280px;
            height: 280px;
            object-fit: cover;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }

        .gallery img:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <h1>Selamat Datang di Galeri Favoritku! ❤️</h1>
    <p>Tempat menyimpan senyuman tercantik di dunia.</p>

    <div class="gallery">
        <img src="1.jpg" alt="my fav pict">
        <img src="2.jpg" alt="always pretty">
        <img src="3.jpg" alt="and cute">
    </div>

</body>
</html>
